name: One-time Google verification hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Google site verification
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/layout.tsx')
          s = p.read_text()
          old = 'const googleSiteVerification=process.env.GOOGLE_SITE_VERIFICATION?.trim();'
          new = 'const googleSiteVerification="wJu7Tp9NbeSzLDyYT6aPD22nMtQqddWtFa0ovumGX3c";'
          if old not in s:
              raise SystemExit('Expected Google verification declaration not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit verification tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/layout.tsx
          git commit -m "Add Google site verification meta tag"
          git push
