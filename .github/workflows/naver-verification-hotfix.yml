name: One-time Naver verification hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Naver site verification
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/layout.tsx')
          s = p.read_text()
          old = 'const naverSiteVerification=process.env.NAVER_SITE_VERIFICATION?.trim();'
          new = 'const naverSiteVerification="9f7e4eb2e29aa0514431f1e7aa7f221e3886fb58";'
          if old not in s:
              raise SystemExit('Expected Naver verification declaration not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit verification tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/layout.tsx
          git commit -m "Add Naver site verification meta tag"
          git push
