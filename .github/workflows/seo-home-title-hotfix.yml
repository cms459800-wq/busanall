name: One-time homepage SEO title hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-home-title:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use absolute homepage title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'export const metadata={title:"부산 철거업체 | 상가철거·원상복구 전문 올바른 철거",'
          new = 'export const metadata={title:{absolute:"부산 철거업체 | 상가철거·원상복구 전문 올바른 철거"},'
          if old not in s:
              raise SystemExit('Expected homepage metadata title not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Use absolute homepage SEO title"
          git push

# one-time trigger
